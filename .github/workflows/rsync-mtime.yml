name: rsync-mtime
on:
  push:
    branches: [acl-passthrough-test]
    paths: ['ci/test-rsync-mtime.sh']
jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y rsync
          run: sh ci/test-rsync-mtime.sh
