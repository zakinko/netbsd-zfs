name: iso

# Build NetBSD/amd64 from source with the sysinst root-on-ZFS patch,
# put OpenZFS (zakinko/zfs at patches/OPENZFS_REV) in place of NetBSD's
# own ZFS, make the install ISO, and install from it under qemu choosing
# the new "root on ZFS" layout.  The full build takes about two hours on
# a standard runner, so this only runs when the patch or the CI
# changes, on request, and once a month to catch bit rot.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['patches/**', 'ci/**', '.github/workflows/iso.yml']
  pull_request:
    paths: ['patches/**', 'ci/**', '.github/workflows/iso.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 4 2 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenZFS's userland is built natively, on the NetBSD release the
  # branch is on, against base's libraries only.
  openzfs-user:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out OpenZFS
        run: |
          rev=$(cat patches/OPENZFS_REV)
          git init -q openzfs
          git -C openzfs remote add origin https://github.com/zakinko/zfs.git
          git -C openzfs fetch -q --depth 1 origin "$rev"
          git -C openzfs checkout -q FETCH_HEAD
          git -C openzfs log -1 --format='%H %cd'

      - name: Build the userland on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: "11.0"
          mem: 4096
          cpu: 3
          prepare: |
            /usr/sbin/pkg_add autoconf automake libtool-base gmake gettext-tools
          run: |
            sh ci/build-openzfs-user.sh openzfs openzfs-user

      - name: Pack it
        run: tar -C openzfs-user -cf openzfs-user.tar root static

      - uses: actions/upload-artifact@v4
        with:
          name: openzfs-user
          path: openzfs-user.tar
          retention-days: 7

  iso:
    needs: openzfs-user
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential zlib1g-dev \
              qemu-system-x86 python3-pexpect genisoimage
          sudo chmod 666 /dev/kvm || true

      - name: Check out NetBSD src (netbsd-11)
        run: |
          rev=$(cat patches/SRC_REV)
          git init -q nbsrc/src
          git -C nbsrc/src remote add origin https://github.com/NetBSD/src.git
          git -C nbsrc/src fetch -q --depth 1 origin "$rev"
          git -C nbsrc/src checkout -q FETCH_HEAD
          git -C nbsrc/src log -1 --format='%H %cd'

      - uses: actions/download-artifact@v4
        with:
          name: openzfs-user

      # distrib/common/list.zfsroot (patches/04) copies these into the
      # zfsroot ramdisk.
      - name: Put OpenZFS's static commands in the tree
        run: |
          mkdir openzfs-user
          tar -C openzfs-user -xf openzfs-user.tar
          mkdir -p nbsrc/src/distrib/common/openzfs
          cp openzfs-user/static/zpool openzfs-user/static/mount_zfs \
              nbsrc/src/distrib/common/openzfs/

      - name: Build release
        run: sh ci/build-iso.sh release

      - name: Check out OpenZFS
        run: |
          rev=$(cat patches/OPENZFS_REV)
          git init -q openzfs
          git -C openzfs remote add origin https://github.com/zakinko/zfs.git
          git -C openzfs fetch -q --depth 1 origin "$rev"
          git -C openzfs checkout -q FETCH_HEAD

      - name: Build zfs.kmod against the release's kernel
        run: sh ci/build-openzfs-kmod.sh openzfs

      - name: Put OpenZFS into the sets
        run: sh ci/openzfs-sets.sh openzfs-user nbsrc/openzfs-kmod/zfs.kmod

      - name: Build ISO
        run: sh ci/build-iso.sh iso-image

      - name: Install from the CD with root on ZFS and boot it
        run: sh ci/test-install.sh "$PWD/nbsrc/rel/amd64/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netbsd-zfs-iso
          path: |
            nbsrc/rel/images/NetBSD-*-amd64.iso
            nbsrc/anita.log
          retention-days: 14
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nbsrc/rel/images/NetBSD-*-amd64.iso
