name: acl-passthrough
on:
  push:
    branches: [acl-passthrough-test]
    paths: ['ci/test-acl-tools.sh']
concurrency:
  group: acl-passthrough
  cancel-in-progress: true
jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: pkg install -y rsync vim
          run: sh ci/test-acl-tools.sh
