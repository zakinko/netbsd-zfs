name: zts-netbsd
on:
  push:
    branches: [zts-fixes]
    paths: ['ci/zts/**', 'ci/race/swap.sh', '.github/workflows/zts-netbsd.yml']
concurrency:
  group: zts-netbsd
  cancel-in-progress: true
env:
  ZFS_SHA: 04fb524fc27cc9b610fa9a4f8f81c5829905e6af
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: c
        with:
          path: zts-cache
          key: zts-nb-${{ env.ZFS_SHA }}-${{ hashFiles('ci/zts/build-netbsd.sh') }}
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          mem: 8192
          cpu: 4
          sync: rsync
          prepare: |
            /usr/sbin/pkg_info pkgin >/dev/null 2>&1 || true
            export PKG_PATH=http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/11.0/All
            /usr/sbin/pkg_add -u pkgin || true
            /usr/pkg/bin/pkgin -y update
            /usr/pkg/bin/pkgin -y install autoconf automake libtool-base gmake pkgconf git-base gettext-tools gettext-m4 python313 rsync bash ksh93 sudo fio jq coreutils xxhash
          run: echo vm ready
      - uses: actions/download-artifact@v4
        with:
          name: racekernel
          path: racekernel
          run-id: 41906980157
          github-token: ${{ github.token }}
      - run: sh ci/race/swap.sh racekernel/netbsd RACEFIX ssh netbsd
      - name: Build
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          ssh netbsd "mkdir -p /var/tmp/ci /var/tmp/zc"
          scp -r ci/zts netbsd:/var/tmp/ci/
          ssh -o ServerAliveInterval=30 netbsd "PATH=\$PATH:/usr/pkg/bin:/usr/pkg/sbin sh /var/tmp/ci/zts/build-netbsd.sh $ZFS_SHA /var/tmp/zc" 2>&1
          mkdir -p zts-cache; scp "netbsd:/var/tmp/zc/*" zts-cache/
      - uses: actions/cache/save@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: zts-cache
          key: zts-nb-${{ env.ZFS_SHA }}-${{ hashFiles('ci/zts/build-netbsd.sh') }}
      - name: Run the suite
        timeout-minutes: 170
        run: |
          (while sleep 20; do scp -q -o ConnectTimeout=10 netbsd:/var/tmp/res.tgz res-live.tgz 2>/dev/null; done) &
          ssh netbsd "mkdir -p /var/tmp/ci /var/tmp/zc"
          scp -r ci/zts netbsd:/var/tmp/ci/
          scp zts-cache/* netbsd:/var/tmp/zc/
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 netbsd \
            "PATH=\$PATH:/usr/pkg/bin:/usr/pkg/sbin sh /var/tmp/ci/zts/run-netbsd.sh /var/tmp/ci/zts /var/tmp/zc" 2>&1 | tee zts-console.log
      - name: Collect
        if: always()
        run: |
          ps -ef | grep -E 'qemu' | grep -v grep | cut -c1-900 || true
          ls -la /tmp ~/.anyvm* 2>/dev/null | tail -30 || true
          sleep 150
          ssh -o ConnectTimeout=20 netbsd "uptime; dmesg | grep -iE -A25 'panic|fatal' | tail -60; dmesg | tail -5; mkdir -p /var/crash; savecore /var/crash; ls -la /var/crash; gunzip -f /var/crash/netbsd.*.gz; c=\$(ls -t /var/crash/netbsd.*.core | head -1); [ -n \"\$c\" ] && printf 'ps\\n' | crash -M \$c -N \${c%.core} 2>&1 | grep -v ' 0  *[0-9]* [0-9]  *[0-9]  *[0-9]* ' | head -50 | cut -c1-90; tar czf /var/tmp/res.tgz -C /var/tmp test_results" 2>&1 || true
          scp -o ConnectTimeout=20 netbsd:/var/tmp/res.tgz . || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zts-netbsd
          path: |
            zts-console.log
            res.tgz
            res-live.tgz
          retention-days: 14
