name: zts-netbsd
on:
  push:
    branches: [zts-port]
    paths: ['ci/zts/**', '.github/workflows/zts-netbsd.yml']
concurrency:
  group: zts-netbsd
  cancel-in-progress: true
env:
  ZFS_SHA: 93161431b57c292bc12c0ccdec8953677f876b8c
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: c
        with:
          path: zts-cache
          key: zts-nb-${{ env.ZFS_SHA }}-${{ hashFiles('ci/zts/build-netbsd.sh') }}
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          mem: 8192
          cpu: 4
          sync: rsync
          prepare: |
            /usr/sbin/pkg_info pkgin >/dev/null 2>&1 || true
            export PKG_PATH=http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/11.0/All
            /usr/sbin/pkg_add -u pkgin || true
            /usr/pkg/bin/pkgin -y update
            /usr/pkg/bin/pkgin -y install autoconf automake libtool-base gmake pkgconf git-base gettext-tools gettext-m4 python313 rsync bash ksh93 sudo fio jq coreutils xxhash
          run: echo vm ready
      - name: Build
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          ssh netbsd "mkdir -p /var/tmp/ci /var/tmp/out"
          scp -r ci/zts netbsd:/var/tmp/ci/
          ssh -o ServerAliveInterval=30 netbsd "PATH=\$PATH:/usr/pkg/bin:/usr/pkg/sbin sh /var/tmp/ci/zts/build-netbsd.sh $ZFS_SHA /var/tmp/out" 2>&1
          mkdir -p zts-cache; scp "netbsd:/var/tmp/out/*" zts-cache/
      - uses: actions/cache/save@v4
        if: steps.c.outputs.cache-hit != 'true'
        with:
          path: zts-cache
          key: zts-nb-${{ env.ZFS_SHA }}-${{ hashFiles('ci/zts/build-netbsd.sh') }}
      - name: Run the suite
        timeout-minutes: 170
        run: |
          ssh netbsd "mkdir -p /var/tmp/ci /var/tmp/out"
          scp -r ci/zts netbsd:/var/tmp/ci/
          scp zts-cache/* netbsd:/var/tmp/out/
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 netbsd \
            "PATH=\$PATH:/usr/pkg/bin:/usr/pkg/sbin sh /var/tmp/ci/zts/run-netbsd.sh /var/tmp/ci/zts /var/tmp/out" 2>&1 | tee zts-console.log
      - name: Collect
        if: always()
        run: |
          ssh -o ConnectTimeout=20 netbsd "dmesg | tail -60; tar czf /var/tmp/res.tgz -C /var/tmp test_results" 2>&1 || true
          scp -o ConnectTimeout=20 netbsd:/var/tmp/res.tgz . || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zts-netbsd
          path: |
            zts-console.log
            res.tgz
          retention-days: 14
