name: acl-linux
on:
  push:
    branches: [acl-passthrough-test]
    paths: ['ci/test-acl-linux.sh', '.github/workflows/acl-linux.yml']
concurrency:
  group: acl-linux
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool gawk \
            libaio-dev libattr1-dev libblkid-dev libelf-dev libffi-dev libssl-dev \
            libtirpc-dev libudev-dev uuid-dev zlib1g-dev python3-dev python3-cffi \
            python3-setuptools linux-headers-$(uname -r) nfs4-acl-tools attr vim rsync
      - name: Build
        run: |
          git clone -q --depth 1 -b linux-decoupled https://github.com/zakinko/zfs zfs
          cd zfs; git log -1 --format='%h %s'
          ./autogen.sh
          ./configure --enable-debug --with-config=all > configure.log
          make -s -j$(nproc)
      - name: Test
        run: |
          cd zfs; sudo ./scripts/zfs.sh
          sudo env PATH="$PWD:$PATH" bash ../ci/test-acl-linux.sh 2>&1
