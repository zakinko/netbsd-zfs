name: bootzfs

# The ZFS sources this fetches live in FreeBSD and OpenZFS and move on
# their own, so this runs on a schedule as well as on changes here: the
# breakage that matters is upstream drift, and nothing local announces it.

on:
  push:
    branches: [main]
    paths: ['bootzfs/**', '.github/workflows/bootzfs.yml']
  pull_request:
    paths: ['bootzfs/**', '.github/workflows/bootzfs.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 4 9 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The loader builds natively on a NetBSD host against the system's
      # own /usr/share/mk, so there is no cross toolchain and no
      # build.sh.  syssrc is nearly enough source on its own; src carries
      # common/dist/zlib, which gzip decompression needs.
      - name: Fetch, adjust and build the loader
        uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          copyback: false
          sync: rsync
          mem: 4096
          run: |
            set -e
            B=https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.0/source/sets
            mkdir -p "$HOME/nbsrc" && cd "$HOME/nbsrc"
            ftp -o syssrc.tgz $B/syssrc.tgz
            ftp -o src.tgz $B/src.tgz
            tar xzf syssrc.tgz
            tar xzf src.tgz usr/src/common
            SRC="$HOME/nbsrc/usr/src"

            cd "$GITHUB_WORKSPACE"
            sh bootzfs/fetch.sh "$SRC"
            sh bootzfs/adjust.sh "$SRC"

            cd "$SRC/sys/arch/i386/stand/efiboot"
            make USETOOLS=no MKDTRACE=no

            # A loader that built without ZFS in it would still exit 0,
            # so say what went in rather than trusting that.
            for f in bootx64/bootx64.efi bootia32/bootia32.efi; do
                test -s "$f" || { echo "$f missing"; exit 1; }
                ls -l "$f"
            done
            if nm -u bootx64/bootx64.efi.so | grep .; then
                echo "undefined symbols in bootx64"; exit 1
            fi
            strings bootx64/bootx64.efi | grep -q 'ZFS: ' || {
                echo "no ZFS strings in bootx64.efi -- not built in"
                exit 1
            }
            echo "ZFS is in the loader"
