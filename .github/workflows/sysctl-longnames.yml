name: sysctl-longnames

# Scratch: build NetBSD-current (amd64) with ci/sysctl-longnames.diff
# applied -- the kernel, the whole distribution and the sets, so that
# libc, sysctl(8), the man page and the set lists are checked too --
# and see whether the diff still applies to today's trunk.  Runs only
# on pushes to this branch.

on:
  push:
    branches: [sysctl-longnames-current]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Check out NetBSD src at the diff's base
        run: |
          git init -q src
          git -C src remote add origin https://github.com/NetBSD/src.git
          git -C src fetch -q --depth 1 origin 5bb2f4b8510624aeb1b1134a070f4de28633e5a7
          git -C src checkout -q FETCH_HEAD
          git -C src log -1 --format='%H %cd'
          git -C src apply "$GITHUB_WORKSPACE/ci/sysctl-longnames.diff"
          git -C src status --short | wc -l

      - name: Does it apply to today's trunk?
        run: |
          git init -q head
          git -C head remote add origin https://github.com/NetBSD/src.git
          git -C head fetch -q --depth 1 origin trunk
          git -C head checkout -q FETCH_HEAD
          git -C head log -1 --format='%H %cd'
          git -C head apply --check "$GITHUB_WORKSPACE/ci/sysctl-longnames.diff" && \
              echo "APPLIES-TO-TRUNK" || echo "DOES-NOT-APPLY-TO-TRUNK"
          rm -rf head

      - name: Build tools, kernel, distribution and sets
        run: |
          cd src
          set -o pipefail
          ./build.sh -U -u -m amd64 -j$(nproc) \
              -O ../obj -T ../tools -D ../dest -R ../rel \
              -V MKDEBUG=yes -V MKX11=no -V MKCOMPAT=no \
              tools kernel=GENERIC distribution sets 2>&1 | tail -40
          ls -l ../rel/amd64/binary/sets/ ../obj/sys/arch/amd64/compile/GENERIC/netbsd
          tar -tJf ../rel/amd64/binary/sets/base.tar.xz | grep -E 'libc\.so\.12\.|sbin/sysctl$'
