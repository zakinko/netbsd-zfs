name: acl-osnet
on:
  push:
    branches: [acl-passthrough-test]
    paths: ['ci/test-acl-osnet.sh', '.github/workflows/acl-osnet.yml']
  workflow_dispatch:
concurrency:
  group: acl-osnet
  cancel-in-progress: true
jobs:
  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          mem: 8192
          cpu: 4
          sync: rsync
          prepare: |
            /usr/sbin/pkg_info pkgin >/dev/null 2>&1 || true
            export PKG_PATH=http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/11.0/All
            /usr/sbin/pkg_add -u pkgin || true
            /usr/pkg/bin/pkgin -y update
            /usr/pkg/bin/pkgin -y install rsync vim
          run: |
            sh ci/test-acl-osnet.sh 2>&1
